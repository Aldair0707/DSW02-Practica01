name: Docker Deploy

on:
  workflow_run:
    workflows: ["SonarQube"]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version tag
        id: version
        run: |
          VERSION=$(cat backend/pom.xml | grep -m 1 '<version>' | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Backend version: ${VERSION}"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/dsw02-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/dsw02-backend:${{ steps.version.outputs.version }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/dsw02-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/dsw02-frontend:${{ steps.version.outputs.version }}

      - name: Image digest (backend)
        run: echo "Backend image pushed successfully"

      - name: Image digest (frontend)
        run: echo "Frontend image pushed successfully"
