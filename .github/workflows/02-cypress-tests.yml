name: 02 Cypress Tests

on:
  workflow_run:
    workflows:
      - 01 CI Tests
    types:
      - completed
  workflow_dispatch:

jobs:
  cypress-smoke:
    name: Cypress Smoke Test
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: empleados_db
          POSTGRES_USER: empleados_user
          POSTGRES_PASSWORD: empleados_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U empleados_user -d empleados_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout triggered commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Checkout default branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start backend
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: empleados_db
          DB_USER: empleados_user
          DB_PASSWORD: empleados_pass
          APP_BASIC_USER: admin
          APP_BASIC_PASSWORD: admin123
        run: |
          set -euo pipefail
          mvn -B -DskipTests spring-boot:run &

      - name: Wait for backend
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if nc -z localhost 8080; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start in time."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Cypress smoke test
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install-command: npm ci
          start: npm run start -- --host 0.0.0.0 --port 4200
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 120
          browser: chrome
          spec: cypress/e2e/empleado-login-smoke.cy.ts
        env:
          CYPRESS_BASE_URL: http://localhost:4200