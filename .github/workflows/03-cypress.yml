name: 03 Cypress
run-name: Cypress • ${{ github.event_name }} • ${{ github.ref_name }} • @${{ github.actor }}

on:
  workflow_run:
    workflows:
      - 02 Sonar Analysis
    types:
      - completed
  workflow_dispatch:

jobs:
  cypress-smoke:
    name: Cypress Smoke Test
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: empleados_db
          POSTGRES_USER: empleados_user
          POSTGRES_PASSWORD: empleados_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U empleados_user -d empleados_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend
        working-directory: backend
        run: ./mvnw -B -ntp spring-boot:run > /tmp/backend.log 2>&1 &
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: empleados_db
          DB_USER: empleados_user
          DB_PASSWORD: empleados_pass
          APP_BASIC_USER: admin
          APP_BASIC_PASSWORD: admin123

      - name: Wait backend ready
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start in time"
          cat /tmp/backend.log
          exit 1

      - name: Create proxy for CI
        working-directory: frontend
        run: |
          cat > proxy.ci.conf.json << 'EOF'
          {
            "/api": {
              "target": "http://localhost:8080",
              "secure": false,
              "changeOrigin": true,
              "logLevel": "debug"
            }
          }
          EOF

      - name: Run Cypress smoke test
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install-command: npm ci
          start: npm run start -- --host 0.0.0.0 --port 4200 --proxy-config proxy.ci.conf.json
          wait-on: http://localhost:4200
          wait-on-timeout: 120
          browser: chrome
          spec: cypress/e2e/empleado-login-smoke.cy.ts
        env:
          CYPRESS_BASE_URL: http://localhost:4200

