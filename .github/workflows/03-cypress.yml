name: 03 Cypress
run-name: Cypress • ${{ github.event_name }} • ${{ github.ref_name }} • @${{ github.actor }}

on:
  repository_dispatch:
    types:
      - cypress-ready
  workflow_dispatch:

jobs:
  cypress-smoke:
    name: Cypress Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.client_payload.base_ref == 'master'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: empleados_db
          POSTGRES_USER: empleados_user
          POSTGRES_PASSWORD: empleados_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U empleados_user -d empleados_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend
        working-directory: backend
        run: ./mvnw -B -ntp spring-boot:run > /tmp/backend.log 2>&1 &
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: empleados_db
          DB_USER: empleados_user
          DB_PASSWORD: empleados_pass
          APP_BASIC_USER: admin
          APP_BASIC_PASSWORD: admin123

      - name: Wait backend ready
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start in time"
          cat /tmp/backend.log
          exit 1

      - name: Create proxy for CI
        working-directory: frontend
        run: |
          cat > proxy.ci.conf.json << 'EOF'
          {
            "/api": {
              "target": "http://localhost:8080",
              "secure": false,
              "changeOrigin": true,
              "logLevel": "debug"
            }
          }
          EOF

      - name: Run Cypress smoke test
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install-command: npm ci
          start: npm run start -- --host 0.0.0.0 --port 4200 --proxy-config proxy.ci.conf.json
          wait-on: http://localhost:4200
          wait-on-timeout: 120
          browser: chrome
          spec: cypress/e2e/empleado-login-smoke.cy.ts
        env:
          CYPRESS_BASE_URL: http://localhost:4200

      - name: Dispatch Docker workflow
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.client_payload.sha }}
          HEAD_REF: ${{ github.event.client_payload.ref }}
          BASE_REF: ${{ github.event.client_payload.base_ref }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPOSITORY}/dispatches" \
            -d "$(printf '{\"event_type\":\"docker-ready\",\"client_payload\":{\"sha\":\"%s\",\"ref\":\"%s\",\"base_ref\":\"%s\",\"pr_number\":%s}}' \"${HEAD_SHA}\" \"${HEAD_REF}\" \"${BASE_REF}\" \"${PR_NUMBER}\")"

