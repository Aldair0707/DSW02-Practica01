name: CI
run-name: CI • ${{ github.event_name }} • ${{ github.ref_name }} • @${{ github.actor }}

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Instalar dependencias backend
        run: ./mvnw -B -ntp dependency:resolve
        working-directory: backend

      - name: Ejecutar tests backend
        run: ./mvnw -B -ntp test
        working-directory: backend

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: empleados_db
          POSTGRES_USER: empleados_user
          POSTGRES_PASSWORD: empleados_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U empleados_user -d empleados_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        if: github.event_name == 'push'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend
        run: npm ci
        working-directory: frontend

      - name: Ejecutar tests frontend
        run: npm test -- --watch=false
        working-directory: frontend

      - name: Levantar backend para Cypress
        if: github.event_name == 'push'
        run: ./mvnw -B -ntp spring-boot:run > /tmp/backend.log 2>&1 &
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: empleados_db
          DB_USER: empleados_user
          DB_PASSWORD: empleados_pass
          APP_BASIC_USER: admin
          APP_BASIC_PASSWORD: admin123

      - name: Esperar backend listo
        if: github.event_name == 'push'
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            sleep 2
          done
          echo "Backend no inició a tiempo"
          cat /tmp/backend.log
          exit 1

      - name: Crear proxy de frontend para CI
        if: github.event_name == 'push'
        run: |
          cat > proxy.ci.conf.json << 'EOF'
          {
            "/api": {
              "target": "http://localhost:8080",
              "secure": false,
              "changeOrigin": true,
              "logLevel": "debug"
            }
          }
          EOF
        working-directory: frontend

      - name: Ejecutar Cypress en push
        if: github.event_name == 'push'
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npm run start -- --proxy-config proxy.ci.conf.json
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 120
          command: npx cypress run --spec cypress/e2e/empleado-login-smoke.cy.ts

  trigger-sonarqube:
    name: Trigger SonarQube
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'master'
    permissions:
      contents: write

    steps:
      - name: Dispatch SonarQube workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPOSITORY}/dispatches" \
            -d "$(printf '{\"event_type\":\"sonar-ready\",\"client_payload\":{\"sha\":\"%s\",\"ref\":\"%s\",\"base_ref\":\"%s\",\"pr_number\":%s}}' \"${HEAD_SHA}\" \"${HEAD_REF}\" \"${BASE_REF}\" \"${PR_NUMBER}\")"
