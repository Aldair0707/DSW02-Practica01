name: 01 CI Tests
run-name: CI • ${{ github.event_name }} • ${{ github.ref_name }} • @${{ github.actor }}

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: write

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        run: ./mvnw -B -ntp test

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run frontend tests
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm test -- --watch=false

  trigger-sonarqube:
    name: Trigger SonarQube
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'master'
    permissions:
      contents: write

    steps:
      - name: Dispatch SonarQube workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          payload=$(python - <<'PY'
import json
import os

data = {
    "event_type": "sonar-ready",
    "client_payload": {
        "sha": os.environ["HEAD_SHA"],
        "ref": os.environ["HEAD_REF"],
        "base_ref": os.environ["BASE_REF"],
        "pr_number": int(os.environ["PR_NUMBER"]),
    },
}
print(json.dumps(data))
PY
          )

          status=$(curl -sS -o /tmp/dispatch.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPOSITORY}/dispatches" \
            -d "${payload}")

          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::repository_dispatch failed with status ${status}"
            cat /tmp/dispatch.json
            exit 1
          fi
