name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  test-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: empleados_db
          POSTGRES_USER: empleados_user
          POSTGRES_PASSWORD: empleados_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U empleados_user -d empleados_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias backend
        run: ./mvnw -B -ntp dependency:resolve
        working-directory: backend

      - name: Instalar dependencias frontend
        run: npm ci
        working-directory: frontend

      - name: Ejecutar tests backend
        run: ./mvnw -B -ntp test
        working-directory: backend

      - name: Ejecutar tests frontend
        run: npm test -- --watch=false
        working-directory: frontend

      - name: Levantar backend para Cypress
        if: github.event_name == 'push'
        run: ./mvnw -B -ntp spring-boot:run > /tmp/backend.log 2>&1 &
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: empleados_db
          DB_USER: empleados_user
          DB_PASSWORD: empleados_pass
          APP_BASIC_USER: admin
          APP_BASIC_PASSWORD: admin123

      - name: Esperar backend listo
        if: github.event_name == 'push'
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend listo"
              exit 0
            fi
            sleep 2
          done
          echo "Backend no inició a tiempo"
          cat /tmp/backend.log
          exit 1

      - name: Crear proxy de frontend para CI
        if: github.event_name == 'push'
        run: |
          cat > proxy.ci.conf.json << 'EOF'
          {
            "/api": {
              "target": "http://localhost:8080",
              "secure": false,
              "changeOrigin": true,
              "logLevel": "debug"
            }
          }
          EOF
        working-directory: frontend

      - name: Ejecutar Cypress en push
        if: github.event_name == 'push'
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          start: npm run start -- --proxy-config proxy.ci.conf.json
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 120
          command: npx cypress run --spec cypress/e2e/empleado-login-smoke.cy.ts
