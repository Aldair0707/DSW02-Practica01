name: 02 Sonar Analysis

on:
  repository_dispatch:
    types:
      - sonar-ready
  workflow_dispatch:

jobs:
  sonar-analysis:
    name: Sonar Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.client_payload.base_ref == 'master'
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_PROJECT_KEY: Aldair0707_DSW02-Practica01
      SONAR_ORGANIZATION: aldair0707

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run Sonar analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: backend
        run: |
          set -euo pipefail

          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::error::Falta el secret SONAR_TOKEN en GitHub."
            exit 1
          fi

          echo "Using sonar.projectKey=${SONAR_PROJECT_KEY}"
          echo "Using sonar.organization=${SONAR_ORGANIZATION}"

          ./mvnw -B -ntp verify jacoco:report org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Dispatch Cypress workflow
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.client_payload.sha }}
          HEAD_REF: ${{ github.event.client_payload.ref }}
          BASE_REF: ${{ github.event.client_payload.base_ref }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPOSITORY}/dispatches" \
            -d "$(printf '{\"event_type\":\"cypress-ready\",\"client_payload\":{\"sha\":\"%s\",\"ref\":\"%s\",\"base_ref\":\"%s\",\"pr_number\":%s}}' \"${HEAD_SHA}\" \"${HEAD_REF}\" \"${BASE_REF}\" \"${PR_NUMBER}\")"
