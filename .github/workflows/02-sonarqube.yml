name: SonarQube
run-name: SonarQube • PR->master • @${{ github.actor }}

on:
  repository_dispatch:
    types:
      - sonar-ready

permissions:
  contents: read

jobs:
  sonarqube-analysis:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event.client_payload.base_ref == 'master'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.client_payload.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: SonarQube scan (Maven)
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B -ntp -DskipTests verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey="Aldair0707_DSW02-Practica01" \
            -Dsonar.organization="aldair0707"

      - name: Dispatch Docker workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.client_payload.sha }}
          HEAD_REF: ${{ github.event.client_payload.ref }}
          BASE_REF: ${{ github.event.client_payload.base_ref }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPOSITORY}/dispatches" \
            -d "$(printf '{\"event_type\":\"docker-ready\",\"client_payload\":{\"sha\":\"%s\",\"ref\":\"%s\",\"base_ref\":\"%s\",\"pr_number\":%s}}' \"${HEAD_SHA}\" \"${HEAD_REF}\" \"${BASE_REF}\" \"${PR_NUMBER}\")"
